<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Jules</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-content">
                <h1>Chat with Jules</h1>
                <p>Welcome, {{ user_name }}! <a href="{{ url_for('logout') }}" class="logout-link">Logout</a></p>
            </div>
        </header>
        
        <div id="chat-window" class="chat-window">
            <!-- Initial bot message -->
            <div class="message bot-message">
                <p>Hello, {{ user_name }}! Ask me anything about your Google Analytics 4 data.</p>
            </div>
            <!-- Messages will be appended here by JavaScript -->
        </div>
        
        <div id="loading-indicator" class="loading-indicator" style="display: none;">
            <p>Jules is thinking...</p>
            <div class="spinner"></div>
        </div>

        <footer class="chat-input-area">
            <textarea id="user-query-input" placeholder="Type your message..." rows="2"></textarea>
            <button id="send-query-button" title="Send message">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2 .01 7z"/>
                </svg>
            </button>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
